databases:
  - name: outfit-generator-db
    plan: free
    databaseName: outfit_generator
    user: outfit_generator

services:
  - type: web
    name: outfit-generator-web
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: outfit-generator-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.10"
