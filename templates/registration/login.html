{% extends "base.html" %}
{% block title %}Log in · Outfit Generator{% endblock %}
{% block content %}<div class="container auth-shell"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1 class="h2 mt-2">Open your wardrobe</h1><p class="text-secondary">Log in to keep building outfits.</p><form method="post" class="vstack gap-3">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="btn btn-brand" type="submit">Log in</button></form><p class="small mt-4 mb-0">New here? <a href="{% url 'accounts:signup' %}">Create an account</a>.</p></div></div>{% endblock %}
