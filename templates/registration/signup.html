{% extends "base.html" %}
{% block title %}Create an account · Outfit Generator{% endblock %}
{% block content %}<div class="container auth-shell"><div class="auth-card"><span class="eyebrow">START YOUR COLLECTION</span><h1 class="h2 mt-2">Create your account</h1><p class="text-secondary">Your wardrobe is private and linked only to you.</p><form method="post" class="vstack gap-2">{% csrf_token %}{{ form.as_p }}<button class="btn btn-brand mt-2" type="submit">Create my wardrobe</button></form><p class="small mt-4 mb-0">Already registered? <a href="{% url 'accounts:login' %}">Log in</a>.</p></div></div>{% endblock %}
