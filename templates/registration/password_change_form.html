{% extends "base.html" %}
{% block title %}Change password · Outfit Generator{% endblock %}
{% block content %}<div class="container auth-shell"><div class="auth-card"><span class="eyebrow">ACCOUNT SECURITY</span><h1 class="h2 mt-2">Change password</h1><p class="text-secondary">Enter your current password, then choose a new one.</p><form method="post" class="vstack gap-2">{% csrf_token %}{{ form.as_p }}<button class="btn btn-brand mt-2" type="submit">Update password</button></form><a class="d-inline-block small mt-3" href="{% url 'accounts:profile' %}">← Back to profile</a></div></div>{% endblock %}
