<div class="col-sm-6 col-lg-3" id="garment-{{ garment.pk }}"><article class="garment-card h-100"><div class="garment-image"><img src="{{ garment.image.url }}" alt="{{ garment.name }}" loading="lazy"><span class="category-pill">{{ garment.clothing_type }}</span></div><div class="p-3"><h3 class="h6 mb-1">{{ garment.name }}</h3><p class="small text-secondary mb-3">{{ garment.style }} · {{ garment.main_color }}{% if garment.secondary_color %} / {{ garment.secondary_color }}{% endif %}</p><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-dark flex-grow-1" href="{% url 'wardrobe:garment_update' garment.pk %}">Edit</a><a class="btn btn-sm btn-outline-danger" href="{% url 'wardrobe:garment_delete' garment.pk %}" aria-label="Delete {{ garment.name }}">Delete</a></div></div></article></div>
